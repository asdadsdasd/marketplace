spring.application.name=gateway-service
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**, /v3/api-docs/user-service

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://product-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products/**, /v3/api-docs/product-service

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=User Management Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user-service

springdoc.swagger-ui.urls[1].name=Product Management Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/product-service

jwt.secret=very_secret_key_very_secret_key_very_secret_key




